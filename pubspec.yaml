name: sudoku_app
description: A complete Sudoku game with advanced features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/puzzles/

  # 内置中文子集字体，避免 Web 端首帧等待 CDN 字体时出现方块字。
  # 新增中文文案后运行 tools/build_font_subset.py 重新生成。
  fonts:
    - family: AppSans
      fonts:
        - asset: assets/fonts/AppSans-Regular.ttf
        - asset: assets/fonts/AppSans-Bold.ttf
          weight: 700
